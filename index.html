<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <!-- 360 background -->
      <a-sky src="assets/room1.jpg"></a-sky>

      <!-- Camera + cursor -->
      <a-camera>
        <a-cursor
          fuse="true"
          fuse-timeout="1200"
          color="white">
        </a-cursor>
      </a-camera>

    </a-scene>
  </body>
</html>
