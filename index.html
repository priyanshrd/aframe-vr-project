<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Gaze Teleport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Teleport component -->
    <script>
  AFRAME.registerComponent('gaze-teleport', {
    schema: { target: { type: 'string' } },
    init: function () {
      this.el.addEventListener('click', () => {
        const sky = document.querySelector('#sky');
        const fade = document.querySelector('#fade');
        const sound = document.querySelector('#teleportSound');

        // Play sound immediately on gaze click
        sound.components.sound.playSound();

        // Fade to black
        fade.setAttribute('animation', {
          property: 'material.opacity',
          to: 1,
          dur: 400,
          easing: 'easeInOutQuad'
        });

        // Switch room while screen is black
        setTimeout(() => {
          sky.setAttribute('src', this.data.target);
        }, 400);

        // Fade back in
        setTimeout(() => {
          fade.setAttribute('animation', {
            property: 'material.opacity',
            to: 0,
            dur: 400,
            easing: 'easeInOutQuad'
          });
        }, 800);
      });
    }
  });
</script>
     <script>
AFRAME.registerComponent('mic-info', {
  init: function () {
    const mic = this.el;

    mic.addEventListener('click', () => {
      const sky = document.querySelector('#sky');
      const micSound1 = document.querySelector('#infoRoom1');
      const micSound2 = document.querySelector('#infoRoom2');

      // Hide mic while audio plays
      mic.setAttribute('visible', false);

      let soundEntity;

      if (sky.getAttribute('src') === 'room1.jpg') {
        soundEntity = micSound1;
      } else {
        soundEntity = micSound2;
      }

      soundEntity.components.sound.playSound();

      // Reappear mic after audio ends
      soundEntity.addEventListener('sound-ended', function handler() {
        mic.setAttribute('visible', true);
        soundEntity.removeEventListener('sound-ended', handler);
      });
    });
  }
});
</script>

  </head>

  <body>
    <a-scene>
<!-- MIC HOTSPOT -->
<a-image
  id="mic"
  src="mic.png"
  position="0 2.6 -3"
  scale="0.4 0.4 0.4"
  look-at="[camera]"
  mic-info>
</a-image>

      <!-- SKY -->
      <a-sky id="sky" src="room1.jpg"></a-sky>

      <!-- TELEPORT SOUND -->
      <a-entity
        id="teleportSound"
        sound="src: ./teleport.mp3; preload: true; volume: 1.0">
        </a-entity>
<!-- INFO AUDIO -->
<a-entity id="infoRoom1" sound="src: info-room1.mp3"></a-entity>
<a-entity id="infoRoom2" sound="src: info-room2.mp3"></a-entity>


      <!-- ROOM 1 → ROOM 2 TELEPORT -->
      <a-sphere
        id="toRoom2"
        position="2 1.6 -3"
        radius="0.25"
        color="#00ffcc"
        animation="property: scale; dir: alternate; dur: 800; loop: true; to: 1.2 1.2 1.2"
        gaze-teleport="target: room2.jpg">
      </a-sphere>
      <a-plane
        id="fade"
        position="0 1.6 -0.5"
        width="4"
        height="4"
        material="color: black; opacity: 0"
        visible="true">
        </a-plane>

      <a-text
        value="Teleport to Room 2"
        position="2 2 -3"
        align="center"
        color="white">
      </a-text>

      <!-- ROOM 2 → ROOM 1 TELEPORT -->
      <a-sphere
        id="toRoom1"
        position="-2 1.6 -3"
        radius="0.25"
        color="#ff0066"
        visible="false"
        animation="property: scale; dir: alternate; dur: 800; loop: true; to: 1.2 1.2 1.2"
        gaze-teleport="target: room1.jpg">
      </a-sphere>

      <a-text
        id="backText"
        value="Back to Room 1"
        position="-2 2 -3"
        align="center"
        color="white"
        visible="false">
      </a-text>

      <!-- CAMERA + GAZE CURSOR -->
      <a-camera>
        <a-cursor
          fuse="true"
          fuse-timeout="1200"
          color="white"
          animation__fuse="property: scale; startEvents: fusing; dur: 1200; to: 0.2 0.2 0.2">
        </a-cursor>
      </a-camera>

    </a-scene>

    <script>
      updateHotspots();
    </script>

  </body>
</html>
